databaseChangeLog:
  - changeSet:
      id: create-application-table
      author: items-delivery
      changes:
        - createTable:
            tableName: application
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: integrUUID
                  type: VARCHAR(36)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: clientId
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: createdAt
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updatedAt
                  type: TIMESTAMP

  - changeSet:
      id: create-product-table
      author: items-delivery
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: integrUUID
                  type: VARCHAR(36)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
              - column:
                  name: itemNumber
                  type: VARCHAR(50)
              - column:
                  name: customContext
                  type: VARCHAR(500)
              - column:
                  name: createdAt
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updatedAt
                  type: TIMESTAMP
              - column:
                  name: application_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: add-product-foreign-key
      author: items-delivery
      changes:
        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: application_id
            referencedTableName: application
            referencedColumnNames: id
            constraintName: fk_product_application
            onDelete: CASCADE
